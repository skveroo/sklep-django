<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sklep{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'shop/style.css' %}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a href="{% url 'home' %}" class="navbar-brand">Sklep</a>

        <div class="ms-auto">
            <a href="{% url 'product_list' %}" class="btn btn-outline-light btn-sm me-2">
				Produkty
			</a>
			<a href="{% url 'cart' %}" class="btn btn-outline-light btn-sm me-2">
				Koszyk
			</a>

			{% if user.is_authenticated %}
				<a href="{% url 'my_orders' %}" class="btn btn-outline-light btn-sm me-3">
					Moje zamówienia
				</a>
			{% endif %}

            {% if user.is_authenticated %}
                <span class="text-white me-3">
                    {{ user.username }}
                </span>

                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button class="btn btn-outline-light btn-sm">Wyloguj</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">
                    Zaloguj
                </a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-5">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>

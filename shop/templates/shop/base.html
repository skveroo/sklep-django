{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sklep{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'shop/style.css' %}">
</head>
<body class="shop-body">

<nav class="navbar navbar-expand-lg shop-navbar px-3">
    <div class="container-fluid">
        <a class="navbar-brand text-white fw-bold" href="{% url 'home' %}">Sklep</a>

        <form method="get" action="{% url 'product_list' %}" class="d-flex shop-search">
            <input
                type="text"
                name="q"
                class="form-control me-2"
                placeholder="Szukaj"
                value="{{ request.GET.q }}"
            >
            <button class="btn btn-outline-light">Szukaj</button>
        </form>

        <div class="ms-auto d-flex align-items-center gap-2">
            <a href="{% url 'product_list' %}" class="btn btn-outline-light btn-sm">Produkty</a>
            <a href="{% url 'cart' %}" class="btn btn-outline-light btn-sm">
                Koszyk ({{ cart_count|default:0 }})
            </a>

            {% if user.is_authenticated %}
                <a href="{% url 'my_orders' %}" class="btn btn-outline-light btn-sm">Moje zamówienia</a>

                <span class="text-white small ms-2">
                    Zalogowany: {{ user.username }}
                </span>

                <form method="post" action="{% url 'logout' %}" class="d-inline ms-2">
                    {% csrf_token %}
                    <button class="btn btn-light btn-sm">Wyloguj</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-light btn-sm">Zaloguj</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container py-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>

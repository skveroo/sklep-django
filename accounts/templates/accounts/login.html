{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'shop/style.css' %}">
</head>
<body>

<!-- NAVBAR -->
<nav class="shop-navbar">
    <div class="nav-container">
        <a class="nav-brand" href="{% url 'home' %}">
            <i class="fa-solid fa-store"></i> Sklep
        </a>

        <div class="nav-actions">
            {% if user.is_authenticated %}
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="nav-btn logout-btn">Wyloguj</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="nav-btn login-btn">
                    Zaloguj
                </a>
            {% endif %}
        </div>
    </div>
</nav>

<!-- MAIN -->
<main class="main-content d-flex justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="card shadow-sm" style="width: 380px;">
        <div class="card-body" >

            <h4 class="text-center mb-4">
                <i class="fa-solid fa-right-to-bracket"></i> Logowanie
            </h4>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Login</label>
                    <input type="text" name="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Hasło</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                {% if error %}
                    <div class="alert alert-danger p-2">
                        {{ error }}
                    </div>
                {% endif %}

                <button type="submit" class="btn btn-dark w-100">
                    Zaloguj
                </button>
            </form>

            <div class="text-center mt-3">
                <small>
                    Nie masz konta?
                    <a href="{% url 'register' %}">Zarejestruj się</a>
                </small>
            </div>

        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

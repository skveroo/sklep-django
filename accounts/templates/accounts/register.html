{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Rejestracja</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'shop/style.css' %}">
</head>

<body>

<!-- NAVBAR -->
<nav class="shop-navbar">
    <div class="nav-container">
        <a class="nav-brand" href="{% url 'home' %}">
            <i class="fa-solid fa-store"></i> Sklep
        </a>

        <div class="nav-actions">
            {% if user.is_authenticated %}
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="nav-btn logout-btn">Wyloguj</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="nav-btn login-btn">
                    Zaloguj
                </a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="main-content d-flex justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="sidebar-card" style="max-width: 900px; margin: auto;">

    <h5 class="sidebar-title text-center">
        <i class="fa-solid fa-user-plus"></i> Rejestracja
    </h5>

    <form method="post">
        {% csrf_token %}

        <div class="row">

            <!-- lewo -->
            <div class="col-md-6">

                <div class="filter-group">
                    <label>Login</label>
                    <input type="text" name="username" class="filter-field" required>
                </div>

                <div class="filter-group">
                    <label>E-mail</label>
                    <input type="email" name="email" class="filter-field" required>
                </div>

                <div class="filter-group">
                    <label>Hasło</label>
                    <input type="password" name="password" class="filter-field" required>
                </div>

                <div class="filter-group">
                    <label>Powtórz hasło</label>
                    <input type="password" name="password2" class="filter-field" required>
                </div>

            </div>

            <!-- prawo -->
            <div class="col-md-6">

                <div class="filter-group">
                    <label>Ulica</label>
                    <input type="text"
                           name="street"
                           value="{{ profile.street }}"
                           class="filter-field"
                           placeholder="Przykładowa">
                </div>
                
                <div class="row g-2">
                
                    <div class="col-6">
                        <div class="filter-group">
                            <label>Nr domu</label>
                            <input type="text"
                                   name="house_number"
                                   value="{{ profile.house_number }}"
                                   class="filter-field"
                                   placeholder="8">
                        </div>
                    </div>
                
                    <div class="col-6">
                        <div class="filter-group">
                            <label>Nr mieszkania</label>
                            <input type="text"
                                   name="apartment_number"
                                   value="{{ profile.apartment_number }}"
                                   class="filter-field"
                                   placeholder="67">
                        </div>
                    </div>
                
                </div>
                
                <div class="row g-2">
                
                    <div class="col-4">
                        <div class="filter-group">
                            <label>Kod pocztowy</label>
                            <input type="text"
                                   name="postal_code"
                                   value="{{ profile.postal_code }}"
                                   class="filter-field"
                                   placeholder="00-001">
                        </div>
                    </div>
                
                    <div class="col-8">
                        <div class="filter-group">
                            <label>Miejscowość</label>
                            <input type="text"
                                   name="city"
                                   value="{{ profile.city }}"
                                   class="filter-field"
                                   placeholder="Warszawa">
                        </div>
                    </div>
                
                </div>
                
                <div class="filter-group">
                    <label>Telefon</label>
                    <input type="tel"
                           name="phone"
                           value="{{ profile.phone }}"
                           class="filter-field"
                           placeholder="+48 123 456 789">
                </div>

            </div>

        </div>

        {% if errors %}
            <div class="alert alert-error mt-2">
                <ul class="mb-0">
                    {% for error in errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}

        <button type="submit" class="filter-submit w-100 mt-3">
            Zarejestruj
        </button>
    </form>

    <div class="text-center mt-3">
        <small>
            Masz już konto?
            <a href="{% url 'login' %}">Zaloguj się</a>
        </small>
    </div>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
